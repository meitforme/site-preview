<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>הצעה לתצוגה - רכיב צף לאתר מיטל משה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Heebo,sans-serif;background:#0d2b36;min-height:100vh;padding:14px 10px 30px}
.top{text-align:center;color:#fff;margin-bottom:12px}
.top h1{font-size:19px;font-weight:900}
.top p{font-size:13px;opacity:.85;margin-top:4px}
.tgl{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.tgl button{font-family:inherit;font-size:14px;font-weight:800;padding:10px 16px;border-radius:30px;border:2px solid #01b4d5;background:transparent;color:#c9f3fb;cursor:pointer}
.tgl button.on{background:#01b4d5;color:#fff}
.stage{position:relative;max-width:1000px;margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.stage .bg{width:100%;display:block}
.stage.desk{height:560px}
.stage.desk .bg{height:560px;object-fit:cover;object-position:top center}
.stage.mob{max-width:390px;height:640px}
.stage.mob .bg{height:640px;object-fit:cover;object-position:top center}
.hint{text-align:center;color:#9fd8e4;font-size:13px;margin-top:12px;max-width:680px;margin-left:auto;margin-right:auto;line-height:1.6}
.hint b{color:#fff}
/* ==== הרכיב עצמו - זהה לקוד שיוצב באתר ==== */
.fbox-card{position:absolute;left:22px;bottom:22px;width:305px;background:#fff;border:1px solid #e2edf1;border-top:4px solid #01b4d5;border-radius:16px;box-shadow:0 14px 34px rgba(13,79,92,.28);padding:13px 14px 12px;text-decoration:none;display:block;z-index:5}
.fbox-card.it0{border-top:4px solid #01b4d5}
.fbox-chip{display:inline-block;background:#e2f6fa;color:#0d4f5c;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:20px;margin-bottom:7px}
.fbox-m1{display:block;font-size:15px;font-weight:800;color:#0d4f5c;line-height:1.35;transition:opacity .4s}
.fbox-m1.it{font-style:italic;font-size:13.5px}
.fbox-m2{display:block;font-size:12.5px;font-weight:700;color:#01b4d5;margin-top:6px;transition:opacity .4s}
.fbox-dots{display:flex;gap:4px;margin-top:9px}
.fbox-dots i{width:5px;height:5px;border-radius:50%;background:#d3e6ec}
.fbox-dots i.on{background:#01b4d5;width:14px;border-radius:3px}
.fbox-tab{position:absolute;right:0;top:36%;background:linear-gradient(180deg,#063a44,#01b4d5);color:#fff;width:52px;padding:18px 8px;text-align:center;box-shadow:-4px 4px 18px rgba(1,180,213,.4);text-decoration:none;border-radius:14px 0 0 14px;z-index:6}
.fbox-tab-t{display:block;writing-mode:vertical-rl;font-size:15.5px;font-weight:800;letter-spacing:.5px}
.fbox-tab-a{display:block;font-size:15px;margin-top:8px}
.fbox-tab-card{display:none;position:absolute;right:64px;top:-10px;width:290px;background:#fff;border:1px solid #e2edf1;border-top:4px solid #01b4d5;border-radius:16px;box-shadow:0 14px 34px rgba(13,79,92,.28);padding:13px 14px;text-align:right;color:#0d4f5c}
.fbox-tab:hover .fbox-tab-card,.fbox-tab:focus .fbox-tab-card{display:block}
.stage.mob .fbox-card{left:10px;right:10px;bottom:58px;width:auto;border-top:none;border-right:4px solid #01b4d5;border-radius:13px;padding:9px 12px 10px;box-shadow:0 -6px 18px rgba(13,79,92,.22)}
.stage.mob .fbox-m1{font-size:13px}
.stage.mob .fbox-m2{font-size:11px;margin-top:3px}
.stage.mob .fbox-chip{font-size:9.5px;margin-bottom:4px}
.stage.mob .fbox-dots{margin-top:6px}
.mcall{position:absolute;bottom:0;left:0;right:0;display:flex;gap:8px;padding:8px 10px;background:rgba(10,26,46,.97);border-top:2px solid #01b4d5;z-index:4}
.mcall .tel{background:#01b4d5;color:#fff;font-weight:800;border-radius:9px;padding:10px 12px;font-size:12.5px;flex:1;text-align:center}
.mcall .wa{background:#25D366;color:#fff;font-weight:800;border-radius:9px;padding:10px 12px;font-size:12.5px;white-space:nowrap}
</style></head><body>
